<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Travel Assistant</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="intro" aria-labelledby="page-title">
        <p class="eyebrow">MCP travel assistant</p>
        <h1 id="page-title">Travel Assistant</h1>
        <p class="lede">Chat naturally and the assistant will use controlled travel tools when it needs live data.</p>
        <p id="provider-status" class="provider-status">Provider: checking...</p>
      </section>

      <section class="chat-panel" aria-label="Travel chat">
        <div id="messages" class="messages" aria-live="polite">
          <article class="message assistant">
            <div class="bubble">Hi. Ask me about airports now, for example “Which airport is near Berlin?”</div>
          </article>
        </div>

        <form id="chat-form" class="composer">
          <label class="sr-only" for="message-input">Travel question</label>
          <input
            id="message-input"
            name="message"
            autocomplete="off"
            placeholder="Ask a travel question..."
            required
          />
          <button type="submit">Send</button>
        </form>
      </section>
    </main>

    <script src="/chat.js"></script>
  </body>
</html>
